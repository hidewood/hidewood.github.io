name: Publish blog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: blog-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Get source and theme
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Hugo and build
        env:
          HUGO_VERSION: "0.170.1"
          TZ: Asia/Shanghai
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "$RUNNER_TEMP/hugo.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt" \
            --output "$RUNNER_TEMP/hugo-checksums.txt"
          cd "$RUNNER_TEMP"
          grep " hugo_${HUGO_VERSION}_linux-amd64.tar.gz$" hugo-checksums.txt | sha256sum --check --strict
          tar -xzf hugo.tar.gz
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/hugo" --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Publish website
        id: publish
        uses: actions/deploy-pages@v5
