name: Publish blog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: blog-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Get source and theme
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Hugo and build
        shell: bash
        env:
          HUGO_VERSION: "0.170.1"
          TZ: Asia/Shanghai
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "$RUNNER_TEMP/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt" \
            --output "$RUNNER_TEMP/hugo-checksums.txt"
          cd "$RUNNER_TEMP"
          grep " hugo_${HUGO_VERSION}_linux-amd64.tar.gz$" hugo-checksums.txt | sha256sum --check --strict
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/hugo" --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Wait for site artifact to become available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')" \
              && [[ "$count" -gt 0 ]]; then
              echo "Site artifact is available for deployment."
              exit 0
            fi
            echo "Waiting for uploaded site artifact (attempt $attempt/12)."
            sleep 5
          done
          echo "Site artifact was not available within the expected time."
          exit 1
      - name: Publish website
        id: publish
        uses: actions/deploy-pages@v5
