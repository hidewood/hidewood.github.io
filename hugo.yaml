baseURL: "https://hidewood.github.io/"
locale: en-US
defaultContentLanguage: en
title: "Hidewood's Notes"
theme: PaperMod
hasCJKLanguage: true
enableRobotsTXT: true
pagination:
  pagerSize: 10
outputs:
  home: [HTML, RSS, JSON]
params:
  env: production
  author: hidewood
  description: "Notes on technology, projects, and things I learn."
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowToc: true
  TocOpen: false
  homeInfoParams:
    Title: "👋 Welcome to Hidewood's Notes"
    Content: "Hi，It's hidewood, nice to meet you!"
  socialIcons:
    - name: github
      url: "https://github.com/hidewood"
    - name: rss
      url: /index.xml
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    threshold: 0.4
    keys: [title, permalink, summary, content]
menu:
  main:
    - name: Posts
      url: /posts/
      weight: 10
    - name: Archive
      url: /archives/
      weight: 20
    - name: Search
      url: /search/
      weight: 30
    - name: Tags
      url: /tags/
      weight: 40
    - name: About
      url: /about/
      weight: 50
caches:
  images:
    dir: :cacheDir/images
