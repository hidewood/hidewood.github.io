baseURL: "https://hidewood.github.io/"
locale: zh-CN
defaultContentLanguage: zh
title: "技术札记"
theme: PaperMod
hasCJKLanguage: true
enableRobotsTXT: true
pagination:
  pagerSize: 10
outputs:
  home: [HTML, RSS, JSON]
params:
  env: production
  author: hidewood
  description: "记录技术探索、项目实践与学习笔记。"
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowToc: true
  TocOpen: false
  homeInfoParams:
    Title: "你好，欢迎来到技术札记"
    Content: "把学到的知识写清楚，把做过的事情记下来。这里记录技术探索、项目实践与学习笔记。"
  socialIcons:
    - name: github
      url: "https://github.com/hidewood"
    - name: rss
      url: /index.xml
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    threshold: 0.4
    keys: [title, permalink, summary, content]
menu:
  main:
    - name: 文章
      url: /posts/
      weight: 10
    - name: 归档
      url: /archives/
      weight: 20
    - name: 搜索
      url: /search/
      weight: 30
    - name: 标签
      url: /tags/
      weight: 40
    - name: 关于
      url: /about/
      weight: 50
caches:
  images:
    dir: :cacheDir/images
