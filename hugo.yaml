baseURL: "https://hidewood.github.io/"
locale: en-US
defaultContentLanguage: en
title: "hidewood's blog"
theme: PaperMod
hasCJKLanguage: true
enableRobotsTXT: true
pagination:
  pagerSize: 10
outputs:
  home: [HTML, RSS, JSON]
params:
  env: production
  author: hidewood
  description: "Notes on technology, projects, and things I learn."
  defaultTheme: auto
  label:
    icon: /icons/cat-64.png
    iconHeight: 36
  assets:
    favicon: /icons/cat-256.png
    favicon16x16: /icons/cat-16.png
    favicon32x32: /icons/cat-32.png
    apple_touch_icon: /icons/cat-180.png
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowToc: true
  TocOpen: false
  homeInfoParams:
    Title: "👋 Welcome to hidewood's blog"
    Content: "Hi，It's hidewood, nice to meet you!"
  socialIcons:
    - name: github
      url: "https://github.com/hidewood"
    - name: rss
      url: /index.xml
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    threshold: 0.4
    keys: [title, permalink, summary, content]
menu:
  main:
    - name: Posts
      url: /
      weight: 10
    - name: Archive
      url: /archives/
      weight: 20
    - name: Search
      url: /search/
      weight: 30
    - name: Tags
      url: /tags/
      weight: 40
    - name: About
      url: /about/
      weight: 50
caches:
  images:
    dir: :cacheDir/images
